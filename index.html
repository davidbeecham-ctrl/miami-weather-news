<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miami Weather & News</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100vh;
            color: #2d3436;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .weather-card {
            text-align: center;
        }
        
        .weather-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        
        .temperature {
            font-size: 3rem;
            font-weight: bold;
            color: #0984e3;
            margin-bottom: 10px;
        }
        
        .weather-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        
        .weather-detail {
            background: rgba(116, 185, 255, 0.1);
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }
        
        .weather-detail strong {
            display: block;
            color: #0984e3;
            margin-bottom: 5px;
        }
        
        .news-card h2 {
            color: #0984e3;
            margin-bottom: 20px;
            font-size: 2rem;
        }
        
        .news-item {
            background: rgba(116, 185, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #0984e3;
        }
        
        .news-item h3 {
            color: #2d3436;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        
        .news-item p {
            color: #636e72;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        
        .news-time {
            color: #74b9ff;
            font-size: 0.8rem;
            margin-top: 8px;
        }
        
        .loading {
            text-align: center;
            color: #636e72;
            font-style: italic;
        }
        
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.8);
            margin-top: 30px;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .temperature {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌴 Miami Weather & News</h1>
            <p>Stay updated with the Magic City</p>
        </div>
        
        <div class="grid">
            <div class="card weather-card">
                <div class="weather-icon" id="weatherIcon">🌤️</div>
                <div class="temperature" id="temperature">Loading...</div>
                <div id="weatherDescription">Fetching weather data...</div>
                <div class="weather-details">
                    <div class="weather-detail">
                        <strong>Humidity</strong>
                        <span id="humidity">--%</span>
                    </div>
                    <div class="weather-detail">
                        <strong>Wind</strong>
                        <span id="wind">-- km/h</span>
                    </div>
                    <div class="weather-detail">
                        <strong>Pressure</strong>
                        <span id="pressure">-- hPa</span>
                    </div>
                    <div class="weather-detail">
                        <strong>Updated</strong>
                        <span id="lastUpdated">Just now</span>
                    </div>
                </div>
            </div>
            
            <div class="card news-card">
                <h2>📰 Miami News</h2>
                <div id="newsContainer">
                    <div class="loading">Loading latest news...</div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>Weather data from wttr.in • News from RSS feeds • Updated every 15 minutes</p>
        </div>
    </div>

    <script>
        // Weather functionality
        async function fetchWeather() {
            try {
                const response = await fetch('/api/weather');
                const data = await response.text();
                updateWeatherDisplay(data);
            } catch (error) {
                console.error('Weather fetch failed:', error);
                document.getElementById('temperature').textContent = 'Weather unavailable';
                document.getElementById('weatherDescription').textContent = 'Please try again later';
            }
        }
        
        function updateWeatherDisplay(weatherData) {
            // Parse weather data from wttr.in format
            const parts = weatherData.split(' ');
            let temp = '', condition = '', humidity = '', wind = '', pressure = '';
            
            for (let i = 0; i < parts.length; i++) {
                const part = parts[i];
                if (part.includes('°C')) {
                    temp = part;
                } else if (part.includes('%')) {
                    humidity = part;
                } else if (part.includes('km/h')) {
                    wind = parts[i-1] + part;
                } else if (part.includes('hPa')) {
                    pressure = part;
                } else if (/[🌤️⛅🌦️🌧️☀️🌩️❄️🌫️]/.test(part)) {
                    condition = part;
                }
            }
            
            document.getElementById('temperature').textContent = temp || 'N/A';
            document.getElementById('weatherIcon').textContent = condition || '🌤️';
            document.getElementById('humidity').textContent = humidity || '--';
            document.getElementById('wind').textContent = wind || '--';
            document.getElementById('pressure').textContent = pressure || '--';
            document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
            
            // Set weather description
            const descriptions = {
                '☀️': 'Sunny',
                '⛅': 'Partly Cloudy', 
                '🌤️': 'Partly Sunny',
                '🌦️': 'Light Rain',
                '🌧️': 'Rainy',
                '🌩️': 'Thunderstorms',
                '❄️': 'Snow',
                '🌫️': 'Foggy'
            };
            
            document.getElementById('weatherDescription').textContent = 
                descriptions[condition] || 'Current conditions';
        }
        
        // News functionality
        async function fetchNews() {
            try {
                const response = await fetch('/api/news');
                const newsData = await response.json();
                displayNews(newsData);
            } catch (error) {
                console.error('News fetch failed:', error);
                document.getElementById('newsContainer').innerHTML = 
                    '<div class="loading">News currently unavailable</div>';
            }
        }
        
        function displayNews(newsItems) {
            const container = document.getElementById('newsContainer');
            if (!newsItems || newsItems.length === 0) {
                container.innerHTML = '<div class="loading">No recent news available</div>';
                return;
            }
            
            container.innerHTML = newsItems.map(item => `
                <div class="news-item">
                    <h3>${item.title}</h3>
                    <p>${item.description || 'Read more for full details...'}</p>
                    <div class="news-time">${item.time || 'Recently'}</div>
                </div>
            `).join('');
        }
        
        // Sample news for demonstration
        function loadSampleNews() {
            const sampleNews = [
                {
                    title: "Miami Beach Hosts International Art Fair",
                    description: "The annual art fair brings thousands of visitors to South Beach with contemporary exhibitions from around the world.",
                    time: "2 hours ago"
                },
                {
                    title: "New High-Rise Development Approved in Downtown",
                    description: "City council approves plans for mixed-use tower featuring residential and commercial spaces in the urban core.",
                    time: "4 hours ago"
                },
                {
                    title: "Miami Heat Announces Community Outreach Program", 
                    description: "The NBA franchise launches new initiative to support local youth basketball programs across Miami-Dade County.",
                    time: "6 hours ago"
                },
                {
                    title: "Port of Miami Welcomes Record Cruise Ship",
                    description: "The largest passenger vessel ever to dock at PortMiami brings over 6,000 visitors to the city.",
                    time: "8 hours ago"
                },
                {
                    title: "University of Miami Medical Research Breakthrough",
                    description: "Researchers announce promising results in new treatment approach for tropical diseases common in South Florida.",
                    time: "12 hours ago"
                }
            ];
            
            displayNews(sampleNews);
        }
        
        // Initialize the app
        async function init() {
            await fetchWeather();
            loadSampleNews(); // Using sample news since we need server-side API
            
            // Auto-refresh every 15 minutes
            setInterval(() => {
                fetchWeather();
            }, 15 * 60 * 1000);
        }
        
        // Start the app
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
